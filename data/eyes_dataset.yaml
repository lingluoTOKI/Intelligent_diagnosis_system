# ===========================================
# 眼部疾病数据集 —— 说明文档
# ===========================================
#
# 【重要】YOLO 分类任务不使用本 yaml 文件。
#
#   分类训练的 data 参数应传「目录」，ultralytics 会自动在该目录中
#   查找 train/ 和 val/ 子目录，并从 train/ 的子目录名推断类别：
#
#       model.train(data="<项目根>/data", ...)
#
#   （只有检测/分割等任务才用 yaml 指定 train/val/nc/names；
#     分类任务即使传 yaml 也会被当作数据集名字去下载，导致报错。）
#
# ---------------------------------------------------------------
# 目录结构
# ---------------------------------------------------------------
#   data/train/<类别字母>/*.jpg     训练集（5110 张）
#   data/val/<类别字母>/*.jpg       验证集（1163 张）
#
# ---------------------------------------------------------------
# 类别（字母序，与子目录名一致；亦与 visualization_test2.py 中
#       EyeDiseaseDetector.class_names 保持一致）
# ---------------------------------------------------------------
#   A: AMD                        年龄相关性黄斑变性
#   C: Cataract                   白内障
#   D: Diabetic Retinopathy       糖尿病视网膜病变
#   G: Glaucoma                   青光眼
#   H: Hypertensive Retinopathy   高血压性视网膜病变
#   M: Myopia                     近视性黄斑病变
#   N: Normal                     正常眼底
#   O: Other                      其他眼部疾病
#
# ---------------------------------------------------------------
# 数据集获取说明
# ---------------------------------------------------------------
# 本数据集不随代码仓库分发（课程要求「不含数据集」，眼底影像亦涉及隐私）。
# 获取途径：公开眼底数据集（如 ODIR-5K、EyePACS、Kaggle 眼底图像数据集等）
#           或自行采集，使用前请确认其许可协议。

names:
  0: A
  1: C
  2: D
  3: G
  4: H
  5: M
  6: N
  7: O
