# ===========================================
# 眼部疾病诊断数据集配置（YOLO 分类任务）
# ===========================================

# 数据集根目录（相对于此 yaml 文件）
path: .

# 数据集划分
# 注意：分类任务下，train/val/test 直接指向含类别子目录的文件夹，
#       不需要再加 /images 后缀（那是目标检测任务的格式）。
train: eyes_train
val: eyes_val
test: eyes_test

# 类别数量
nc: 8

# 类别名称（按字母顺序，与子目录名一致）
names:
  0: A
  1: C
  2: D
  3: G
  4: H
  5: M
  6: N
  7: O

# ===========================================
# 类别说明（与 visualization_test2.py 中 EyeDiseaseDetector.class_names 保持一致）
# ===========================================
# A: AMD                        年龄相关性黄斑变性
# C: Cataract                   白内障
# D: Diabetic Retinopathy       糖尿病视网膜病变
# G: Glaucoma                   青光眼
# H: Hypertensive Retinopathy   高血压性视网膜病变
# M: Myopia                     近视性黄斑病变
# N: Normal                     正常眼底
# O: Other                      其他眼部疾病

# ===========================================
# 数据集获取说明
# ===========================================
# 本数据集不随代码仓库分发（课程要求「不含数据集」，且眼底影像涉及隐私）。
# 目录结构：
#   data/eyes_train/<类别字母>/*.jpg    训练集（5110 张）
#   data/eyes_val/<类别字母>/*.jpg      验证集（1163 张）
#   data/eyes_test/<类别字母>/*.jpg     测试集（可选，当前未提供）
# 获取途径：公开眼底数据集（如 ODIR-5K、EyePACS、Kaggle 眼底图像数据集等）
#           或自行采集，使用前请确认其许可协议。
