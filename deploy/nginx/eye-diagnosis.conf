# ============================================================
# 阶段二：最终配置（HTTP 强制跳转 HTTPS + 反向代理到本机 8000）
# 放置路径：/etc/nginx/sites-available/zz-eye-diagnosis.conf
# （用 zz- 前缀使其排在 game.conf 之后加载，保证旧域名所在配置仍是默认 server，
#   两个域名按 server_name 精确匹配共存，互不影响）
# 证书来源 A：Let's Encrypt（certbot，推荐，自动续期）
# 证书来源 B：阿里云免费证书 —— 把下面两行换成阿里云下载的
#              .pem（证书链）与 .key（私钥）实际路径即可
# 注：证书只签了主域名 lingluo-toki.top，故不要在这里加 www 子域，
#     否则访问 www 会因证书名不匹配而告警（需签 www 后再加）。
# ============================================================

# WebSocket / 流式返回的连接升级变量（必须放在 server 块之外）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream eye_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---------- 80 端口：验证目录 + 全量跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name lingluo-toki.top;

    # 续期验证必须保留，否则 90 天后证书无法自动续期
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：HTTPS + 反向代理 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lingluo-toki.top;

    # Let's Encrypt（默认）
    ssl_certificate     /etc/letsencrypt/live/lingluo-toki.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingluo-toki.top/privkey.pem;

    # 阿里云免费证书（如改用阿里云，取消下面两行注释并注释掉上面两行）
    # ssl_certificate     /etc/nginx/cert/lingluo-toki.top.pem;
    # ssl_certificate_key /etc/nginx/cert/lingluo-toki.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 眼底图像与批量上传：默认 1m 会直接 413 失败
    client_max_body_size 50m;

    # 2GB 内存机器上适当收紧缓冲
    client_body_buffer_size 256k;

    location / {
        proxy_pass http://eye_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 若后续接入 WebSocket / 流式返回
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 批量推理耗时较长，超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }

    # 健康检查可单独放行，便于监控
    location = /api/health {
        proxy_pass http://eye_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
